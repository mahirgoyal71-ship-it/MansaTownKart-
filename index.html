<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instamart Grocery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased pb-24">

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-40 bg-green-600 text-white shadow-md">
        <div class="max-w-md mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Instamart Grocery</h1>
                    <p class="text-xs text-green-100 flex items-center gap-1">
                        <i class="fa-solid me-1 fa-truck-fast"></i> Delivery Available • Min. Order ₹500
                    </p>
                </div>
                <div class="relative">
                    <button id="cartIconBtn" onclick="toggleCartModal()" class="relative p-2 bg-green-700 rounded-full hover:bg-green-800 transition">
                        <i class="fa-solid fa-cart-shopping text-lg"></i>
                        <span id="cartBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-green-600">0</span>
                    </button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="mt-3 relative">
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Search vegetables, snacks, daily essentials..." 
                    class="w-full pl-10 pr-4 py-2 rounded-lg text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-green-300 text-sm shadow-inner">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400"></i>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- Category Filter -->
        <div class="mb-4">
            <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Categories</h2>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="categoryContainer">
                <button onclick="selectCategory('All')" class="cat-btn active bg-green-600 text-white px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm transition">All</button>
                <button onclick="selectCategory('Vegetables & Fruits')" class="cat-btn bg-white text-gray-700 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm border border-gray-200 transition">Vegetables & Fruits</button>
                <button onclick="selectCategory('Dairy & Bakery')" class="cat-btn bg-white text-gray-700 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm border border-gray-200 transition">Dairy & Bakery</button>
                <button onclick="selectCategory('Snacks & Drinks')" class="cat-btn bg-white text-gray-700 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm border border-gray-200 transition">Snacks & Drinks</button>
                <button onclick="selectCategory('Staples & Spices')" class="cat-btn bg-white text-gray-700 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm border border-gray-200 transition">Staples & Spices</button>
            </div>
        </div>

        <!-- Products Grid -->
        <div>
            <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2" id="sectionTitle">All Products</h2>
            
            <div id="loadingSpinner" class="flex flex-col items-center justify-center py-10">
                <i class="fa-solid fa-spinner fa-spin text-green-600 text-3xl mb-2"></i>
                <p class="text-xs text-gray-500">Loading products...</p>
            </div>

            <div id="productsGrid" class="grid grid-cols-2 gap-3 hidden">
                <!-- Products will load dynamically -->
            </div>
        </div>
    </main>

    <!-- Bottom Floating Cart Bar -->
    <div id="floatingCart" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-30 hidden">
        <div class="max-w-md mx-auto p-3 flex items-center justify-between">
            <div>
                <span id="floatCartItems" class="text-xs text-gray-500 block">0 Items</span>
                <span id="floatCartTotal" class="text-base font-bold text-green-700">₹0</span>
            </div>
            <button onclick="toggleCartModal()" class="bg-green-600 text-white text-sm font-bold px-5 py-2.5 rounded-lg flex items-center gap-2 shadow-md hover:bg-green-700 active:scale-95 transition">
                View Cart <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Cart Modal Screen -->
    <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 flex justify-center items-end hidden">
        <div class="bg-white w-full max-w-md rounded-t-2xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
            
            <!-- Modal Header -->
            <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-green-600"></i> Your Shopping Cart
                </h3>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-gray-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Minimum Order Banner (Strict ₹500 Notice) -->
            <div id="minOrderAlert" class="bg-amber-50 border-b border-amber-200 px-4 py-2.5 text-xs text-amber-800 flex items-center gap-2">
                <i class="fa-solid fa-circle-info text-amber-600 text-sm flex-shrink-0"></i>
                <span id="minOrderText">Minimum order value is <strong>₹500</strong>.</span>
            </div>

            <!-- Cart Items List -->
            <div id="cartItemsList" class="p-4 overflow-y-auto flex-1 divide-y divide-gray-100">
                <!-- Items populated here -->
            </div>

            <!-- Cart Footer -->
            <div class="p-4 bg-gray-50 border-t border-gray-200">
                <div class="space-y-1 mb-3 text-xs text-gray-600">
                    <div class="flex justify-between">
                        <span>Items Subtotal</span>
                        <span id="modalSubtotal" class="font-semibold text-gray-800">₹0</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Delivery Fee</span>
                        <span id="modalDeliveryFee" class="font-semibold text-gray-800">₹30</span>
                    </div>
                    <div class="flex justify-between text-sm font-bold text-gray-900 pt-2 border-t border-gray-200">
                        <span>Grand Total</span>
                        <span id="modalGrandTotal" class="text-green-700">₹0</span>
                    </div>
                </div>

                <!-- Customer Details Form -->
                <div class="space-y-2 mb-3">
                    <input type="text" id="custName" placeholder="Your Full Name *" class="w-full text-xs p-2.5 border rounded-lg focus:ring-1 focus:ring-green-500 outline-none">
                    <textarea id="custAddress" placeholder="Delivery Address / House No / Street *" rows="2" class="w-full text-xs p-2.5 border rounded-lg focus:ring-1 focus:ring-green-500 outline-none"></textarea>
                </div>

                <!-- Checkout Button -->
                <button id="checkoutBtn" onclick="processCheckout()" disabled
                    class="w-full bg-gray-400 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-sm shadow-md transition cursor-not-allowed">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span id="checkoutBtnText">Order Minimum ₹500 Required</span>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Supabase Initialization
        const SUPABASE_URL = "https://gbapxuxopmtagvvdqavo.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_NY16wFejv2PuzsxZ5YN5iQ_RR81adXe";
        const WHATSAPP_NUMBER = "919000000000"; // Replace with your shop WhatsApp number
        const MIN_ORDER_VALUE = 500;
        const DELIVERY_FEE = 30;

        let db = null;
        if (typeof supabase !== 'undefined') {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // Fallback Products (Guarantees zero loading issues)
        const fallbackProducts = [
            { id: 1, name: "Fresh Tomatoes", category: "Vegetables & Fruits", price: 40, unit: "1 kg", image: "https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300" },
            { id: 2, name: "Fresh Potatoes", category: "Vegetables & Fruits", price: 30, unit: "1 kg", image: "https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=300" },
            { id: 3, name: "Amul Taaza Milk", category: "Dairy & Bakery", price: 27, unit: "500 ml", image: "https://images.unsplash.com/photo-1563636619-e9143da7973b?w=300" },
            { id: 4, name: "Fresh Bread", category: "Dairy & Bakery", price: 40, unit: "400 g", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300" },
            { id: 5, name: "Lays Potato Chips", category: "Snacks & Drinks", price: 20, unit: "50 g", image: "https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=300" },
            { id: 6, name: "Fortune Basmati Rice", category: "Staples & Spices", price: 120, unit: "1 kg", image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300" }
        ];

        let allProducts = [];
        let cart = {};
        let currentCategory = 'All';

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
        });

        async function fetchProducts() {
            const spinner = document.getElementById('loadingSpinner');
            const grid = document.getElementById('productsGrid');

            try {
                if (db) {
                    const { data, error } = await db.from('products').select('*');
                    if (data && data.length > 0 && !error) {
                        allProducts = data;
                    } else {
                        allProducts = fallbackProducts;
                    }
                } else {
                    allProducts = fallbackProducts;
                }
            } catch (err) {
                console.log('Using fallback products:', err);
                allProducts = fallbackProducts;
            }

            spinner.classList.add('hidden');
            grid.classList.remove('hidden');
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-8 text-gray-400 text-xs">No products found</div>`;
                return;
            }

            products.forEach(p => {
                const qty = cart[p.id] ? cart[p.id].qty : 0;
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl p-3 shadow-sm border border-gray-100 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}" class="w-full h-28 object-cover rounded-lg mb-2">
                        <span class="text-[10px] bg-green-50 text-green-700 px-2 py-0.5 rounded font-medium">${p.category || 'Grocery'}</span>
                        <h3 class="font-bold text-xs text-gray-800 mt-1 line-clamp-1">${p.name}</h3>
                        <p class="text-[11px] text-gray-400">${p.unit || '1 unit'}</p>
                    </div>
                    <div class="mt-3 flex items-center justify-between">
                        <span class="font-bold text-sm text-gray-900">₹${p.price}</span>
                        <div id="btn-container-${p.id}">
                            ${getCartButtonHTML(p.id, qty)}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function getCartButtonHTML(id, qty) {
            if (qty > 0) {
                return `
                    <div class="flex items-center bg-green-600 text-white rounded-lg px-2 py-1 gap-2 text-xs font-bold">
                        <button onclick="updateQty(${id}, -1)" class="px-1 hover:text-gray-200">-</button>
                        <span>${qty}</span>
                        <button onclick="updateQty(${id}, 1)" class="px-1 hover:text-gray-200">+</button>
                    </div>
                `;
            }
            return `
                <button onclick="updateQty(${id}, 1)" class="bg-green-50 text-green-700 border border-green-200 font-bold px-3 py-1 rounded-lg text-xs hover:bg-green-600 hover:text-white transition">
                    ADD
                </button>
            `;
        }

        function updateQty(id, change) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            if (!cart[id]) {
                cart[id] = { ...product, qty: 0 };
            }

            cart[id].qty += change;

            if (cart[id].qty <= 0) {
                delete cart[id];
            }

            // Update product card button UI
            const btnContainer = document.getElementById(`btn-container-${id}`);
            if (btnContainer) {
                btnContainer.innerHTML = getCartButtonHTML(id, cart[id] ? cart[id].qty : 0);
            }

            updateCartSummary();
        }

        function updateCartSummary() {
            const items = Object.values(cart);
            const totalItems = items.reduce((sum, item) => sum + item.qty, 0);
            const subtotal = items.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // Floating Bar
            const floatCart = document.getElementById('floatingCart');
            const cartBadge = document.getElementById('cartBadge');
            
            if (totalItems > 0) {
                floatCart.classList.remove('hidden');
                cartBadge.classList.remove('hidden');
                cartBadge.innerText = totalItems;
                document.getElementById('floatCartItems').innerText = `${totalItems} ${totalItems === 1 ? 'Item' : 'Items'}`;
                document.getElementById('floatCartTotal').innerText = `₹${subtotal + (subtotal > 0 ? DELIVERY_FEE : 0)}`;
            } else {
                floatCart.classList.add('hidden');
                cartBadge.classList.add('hidden');
            }

            // Modal Update
            renderCartModalItems(items, subtotal);
        }

        function renderCartModalItems(items, subtotal) {
            const list = document.getElementById('cartItemsList');
            const subtotalEl = document.getElementById('modalSubtotal');
            const grandTotalEl = document.getElementById('modalGrandTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');
            const checkoutBtnText = document.getElementById('checkoutBtnText');
            const minAlertText = document.getElementById('minOrderText');

            list.innerHTML = '';

            if (items.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-400 text-xs py-8">Your cart is empty.</p>`;
                subtotalEl.innerText = '₹0';
                grandTotalEl.innerText = '₹0';
                checkoutBtn.disabled = true;
                checkoutBtn.className = "w-full bg-gray-300 text-gray-500 font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-sm cursor-not-allowed";
                checkoutBtnText.innerText = "Cart is Empty";
                minAlertText.innerHTML = "Minimum order value is <strong>₹500</strong>.";
                return;
            }

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = "py-2.5 flex items-center justify-between";
                row.innerHTML = `
                    <div>
                        <h4 class="font-bold text-xs text-gray-800">${item.name}</h4>
                        <p class="text-[10px] text-gray-400">₹${item.price} × ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-xs text-gray-900">₹${item.price * item.qty}</span>
                        <div class="flex items-center bg-gray-100 rounded px-2 py-0.5 text-xs font-bold gap-2">
                            <button onclick="updateQty(${item.id}, -1)" class="text-gray-600">-</button>
                            <span>${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="text-gray-600">+</button>
                        </div>
                    </div>
                `;
                list.appendChild(row);
            });

            const grandTotal = subtotal + DELIVERY_FEE;
            subtotalEl.innerText = `₹${subtotal}`;
            grandTotalEl.innerText = `₹${grandTotal}`;

            // Strict Minimum ₹500 Order Lock
            if (subtotal < MIN_ORDER_VALUE) {
                const diff = MIN_ORDER_VALUE - subtotal;
                minAlertText.innerHTML = `Add <strong>₹${diff}</strong> more to reach minimum order limit of <strong>₹500</strong>.`;
                checkoutBtn.disabled = true;
                checkoutBtn.className = "w-full bg-gray-400 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-sm cursor-not-allowed opacity-80";
                checkoutBtnText.innerText = `Add ₹${diff} more to order`;
            } else {
                minAlertText.innerHTML = `<span class="text-green-700 font-bold"><i class="fa-solid fa-circle-check"></i> Minimum ₹500 order requirement met!</span>`;
                checkoutBtn.disabled = false;
                checkoutBtn.className = "w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-sm shadow-lg active:scale-95 transition cursor-pointer";
                checkoutBtnText.innerText = "Place Order on WhatsApp";
            }
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('hidden');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText === cat) {
                    btn.className = "cat-btn active bg-green-600 text-white px-4 py-1.5 rounded-ful
